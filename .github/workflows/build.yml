name: بناء التطبيق (ويب + أندرويد + ويندوز)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: رقم الإصدار
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  web:
    name: نسخة الويب
    needs: meta
    runs-on: ubuntu-latest
    env: { VITE_APP_VERSION: '${{ needs.meta.outputs.version }}' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx vite build --mode single && cp dist-single/index.html WorldExplorer-web.html
      - uses: actions/upload-artifact@v4
        with: { name: web-single, path: WorldExplorer-web.html }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  pages:
    name: نشر على GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true   # يعمل بعد تفعيل Pages من إعدادات المستودع
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: أندرويد APK
    needs: meta
    runs-on: ubuntu-latest
    env: { VITE_APP_VERSION: '${{ needs.meta.outputs.version }}' }
    steps:
      - uses: actions/checkout@v5
      - name: التحقق من وجود كلمة سر التوقيع
        env: { KS_PW: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' }
        run: |
          if [ -z "$KS_PW" ]; then echo "::error::أضف السر ANDROID_KEYSTORE_PASSWORD في إعدادات المستودع (Settings → Secrets and variables → Actions)"; exit 1; fi
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: الأيقونات وشاشة البداية
        run: npx --yes @capacitor/assets@4 generate --android --iconBackgroundColor '#2b7fd4' --splashBackgroundColor '#2b7fd4'
      - run: npx cap sync android
      - name: رقم الإصدار
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ needs.meta.outputs.version }}\"/" android/app/build.gradle
      - name: بناء APK (نسخة إصدار، غير قابلة للتصحيح)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: التوقيع بالمفتاح الثابت والتحقق من البصمة
        env: { KS_PW: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' }
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/release.jks.enc -out release.jks -pass env:KS_PW
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias worldexplorer --ks-pass env:KS_PW --key-pass env:KS_PW --out WorldExplorer.apk aligned.apk
          rm -f release.jks
          GOT=$($BT/apksigner verify --print-certs WorldExplorer.apk | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')
          WANT=$(cat ci/release-cert.sha256)
          echo "بصمة التوقيع: $GOT"
          if [ "$GOT" != "$WANT" ]; then echo "::error::بصمة التوقيع لا تطابق البصمة المعتمدة"; exit 1; fi
          if $BT/aapt dump badging WorldExplorer.apk | grep -q application-debuggable; then echo "::error::النسخة قابلة للتصحيح"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: WorldExplorer.apk }

  windows:
    name: ويندوز EXE
    needs: meta
    runs-on: windows-latest
    env: { VITE_APP_VERSION: '${{ needs.meta.outputs.version }}' }
    steps:
      - uses: actions/checkout@v5
      - name: رقم الإصدار
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version='${{ needs.meta.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build
      - name: نسخ ملف التثبيت
        shell: bash
        run: cp src-tauri/target/release/bundle/nsis/*.exe WorldExplorer-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: WorldExplorer-Setup.exe }

  release:
    name: إصدار للتحميل
    needs: [meta, web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: مستكشف العالم ${{ needs.meta.outputs.version }}
          make_latest: true
          body: |
            ## التحميل
            - **أندرويد:** `WorldExplorer.apk` — افتحه على الهاتف واسمح بالتثبيت من هذا المصدر.
            - **ويندوز:** `WorldExplorer-Setup.exe` — عند ظهور تحذير Windows اضغط "مزيد من المعلومات" ثم "تشغيل على أي حال".
            - **ويب (بلا إنترنت):** `WorldExplorer-web.html` — ملف واحد يفتح في أي متصفح.
          files: |
            WorldExplorer.apk
            WorldExplorer-Setup.exe
            WorldExplorer-web.html
